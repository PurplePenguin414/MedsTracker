<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Med Refill Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <h1>Med Refill Tracker</h1>
    <form id="login-form">
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <div id="login-error" class="login-error"></div>
    </form>
  </div>
</div>

<div id="app" class="app hidden">

  <header class="topbar">
    <h1>Med Refill Tracker</h1>
    <div class="topbar-actions">
      <button id="add-med-btn" class="btn btn-primary">+ Add medication</button>
      <button id="test-reminder-btn" class="btn btn-ghost">Test Discord reminder</button>
      <button id="logout-btn" class="btn btn-ghost">Log out</button>
    </div>
  </header>

  <div class="summary-strip" id="summary-strip"></div>

  <main id="med-list" class="med-list"></main>

</div>

<!-- History Modal (view-only, not an input form) -->
<div id="history-modal" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="history-title">Pickup history</h2>
    <div id="history-list" class="history-list"></div>
    <div class="modal-actions">
      <button type="button" id="history-close-btn" class="btn btn-ghost">Close</button>
    </div>
  </div>
</div>

<script src="app.js?v=2"></script>
</body>
</html>
