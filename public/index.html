<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Med Refill Tracker</title>
<link rel="stylesheet" href="style.css?v=4">

<!-- Home screen / PWA support -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meds">
<meta name="theme-color" content="#2f6f9f">
<link rel="icon" type="image/x-icon" href="favicon.ico?v=1">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png?v=1">
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <h1>Med Refill Tracker</h1>
    <form id="login-form">
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <div id="login-error" class="login-error"></div>
    </form>
  </div>
</div>

<div id="app" class="app hidden">

  <header class="topbar">
    <h1>Med &amp; Appointment Tracker</h1>
    <div class="topbar-actions">
      <span class="theme-toggle-wrap">
        <span class="theme-toggle-icon">☀️</span>
        <label class="theme-toggle">
          <input type="checkbox" id="theme-toggle-checkbox">
          <span class="theme-toggle-slider"></span>
        </label>
        <span class="theme-toggle-icon">🌙</span>
      </span>
      <button id="add-med-btn" class="btn btn-primary mode-only-meds">+ Add</button>
      <div class="more-menu-wrap">
        <button id="more-menu-btn" class="btn btn-ghost" aria-label="More actions">⋯</button>
        <div id="more-menu-panel" class="more-menu-panel hidden">
          <button type="button" class="more-menu-item" id="export-pdf-btn">Export PDF</button>
          <button type="button" class="more-menu-item" id="export-history-pdf-btn">Export Full History</button>
          <button type="button" class="more-menu-item" id="test-reminder-btn">Test med Discord reminder</button>
          <button type="button" class="more-menu-item" id="test-appt-reminder-btn">Test appointment Discord reminder</button>
          <div class="more-menu-divider"></div>
          <button type="button" class="more-menu-item" id="logout-btn">Log out</button>
        </div>
      </div>
    </div>
  </header>

  <div class="mode-tab-row">
    <button type="button" class="mode-tab-btn active" data-mode="meds">Medications</button>
    <button type="button" class="mode-tab-btn" data-mode="appointments">Appointments</button>
  </div>

  <div id="meds-view" class="mode-view">
    <div class="summary-strip" id="summary-strip"></div>
    <main id="med-list" class="med-list"></main>
  </div>

  <div id="appointments-view" class="mode-view hidden">

    <nav class="appt-tabs">
      <button class="appt-tab-btn active" data-type="dashboard">Dashboard</button>
      <button class="appt-tab-btn" data-type="therapy">Therapy / EMDR</button>
      <button class="appt-tab-btn" data-type="dietitian">Dietitian</button>
      <button class="appt-tab-btn" data-type="doctor">Doctor</button>
      <button class="appt-tab-btn" data-type="other">Other</button>
    </nav>

    <div id="appt-dashboard-view" class="appt-view-panel">
      <h2 class="appt-dashboard-heading">Upcoming Appointments</h2>
      <div id="appt-dash-all" class="appt-list"></div>
    </div>

    <div class="appt-toolbar hidden" id="appt-type-toolbar">
      <div class="appt-view-toggle">
        <button class="appt-view-btn active" data-view="upcoming">Upcoming</button>
        <button class="appt-view-btn" data-view="history">History</button>
        <button class="appt-view-btn appt-therapy-only" data-view="prep">Prep Checklist</button>
      </div>
      <button id="add-appt-btn" class="btn btn-primary">+ New Appointment</button>
    </div>

    <div id="appt-upcoming-view" class="appt-view-panel hidden">
      <div id="appt-upcoming-list" class="appt-list"></div>
    </div>

    <div id="appt-history-view" class="appt-view-panel hidden">
      <div id="appt-history-list" class="appt-list"></div>
    </div>

    <div id="appt-prep-view" class="appt-view-panel appt-therapy-only hidden">
      <div class="appt-prep-header">
        <h2>Prep Checklist</h2>
        <button id="manage-appt-questions-btn" class="btn btn-ghost btn-small">Manage Questions</button>
      </div>
      <p class="appt-prep-hint">Select an upcoming therapy appointment to check off what you want to bring up.</p>
      <select id="appt-prep-select"></select>
      <div id="appt-prep-checklist" class="appt-prep-checklist"></div>
    </div>

  </div>

</div>

<!-- Appointment Add/Edit Modal -->
<div id="appt-modal" class="modal-overlay hidden">
  <div class="modal modal-wide">
    <h2 id="appt-modal-title">New Appointment</h2>
    <form id="appt-form">
      <input type="hidden" id="appt-id">
      <input type="hidden" id="appt-type">

      <div class="field-row">
        <label class="field">
          Provider Name
          <input type="text" id="appt-provider-name">
        </label>
        <label class="field">
          Status
          <select id="appt-status">
            <option value="upcoming">Upcoming</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          Date
          <input type="date" id="appt-date" required>
        </label>
        <label class="field">
          Time
          <input type="time" id="appt-time">
        </label>
      </div>

      <label class="field field-wide">
        Location
        <input type="text" id="appt-location">
      </label>

      <div id="appt-type-specific-fields"></div>

      <label class="field field-wide">
        Notes
        <textarea id="appt-notes" rows="3"></textarea>
      </label>

      <label class="field field-wide">
        Attachments (PDF, image)
        <input type="file" id="appt-file-upload" accept=".pdf,.png,.jpg,.jpeg,.webp,.heic,.txt">
      </label>
      <div id="appt-attachment-list" class="appt-attachment-list"></div>

      <label class="field-inline">
        <input type="checkbox" id="appt-reminder-enabled" checked>
        Enable reminder
      </label>

      <div class="modal-actions">
        <button type="button" id="delete-appt-btn" class="btn btn-danger hidden">Delete</button>
        <button type="submit" class="btn btn-primary">Save Appointment</button>
      </div>
    </form>
  </div>
</div>

<!-- Manage Questions Modal -->
<div id="appt-questions-modal" class="modal-overlay hidden">
  <div class="modal">
    <h2>EMDR Question Bank</h2>
    <form id="appt-add-question-form" class="inline-add-form">
      <div class="field-row">
        <input type="text" id="appt-new-question-text" placeholder="Add a new question...">
        <button type="submit" class="btn btn-primary btn-small">Add</button>
      </div>
    </form>
    <div id="appt-question-bank-list" class="appt-question-bank-list"></div>
    <div class="modal-actions">
      <button type="button" id="close-appt-questions-btn" class="btn btn-ghost">Close</button>
    </div>
  </div>
</div>

<!-- History Modal: tabbed view with inline "add entry" forms -->
<div id="history-modal" class="modal-overlay hidden">
  <div class="modal modal-wide">
    <h2 id="history-title">History</h2>

    <div class="tab-row">
      <button type="button" class="tab-btn active" data-tab="pickups" onclick="switchHistoryTab('pickups')">Pickups</button>
      <button type="button" class="tab-btn" data-tab="symptoms" onclick="switchHistoryTab('symptoms')">Symptoms</button>
      <button type="button" class="tab-btn" data-tab="titration" onclick="switchHistoryTab('titration')">Titration</button>
    </div>

    <div id="tab-pickups" class="tab-panel">
      <div id="history-list" class="history-list"></div>
    </div>

    <div id="tab-symptoms" class="tab-panel hidden">
      <div id="symptoms-list" class="history-list"></div>
      <div class="inline-add-form">
        <div class="field-row">
          <label class="field">
            Date
            <input type="date" id="symptom-date">
          </label>
          <label class="field">
            Severity
            <select id="symptom-severity">
              <option value="Mild">Mild</option>
              <option value="Moderate">Moderate</option>
              <option value="Severe">Severe</option>
            </select>
          </label>
        </div>
        <label class="field field-wide">
          Description <span class="optional">(optional)</span>
          <textarea id="symptom-description" rows="2" placeholder="What happened, when it started, anything notable..."></textarea>
        </label>
        <div class="form-error" id="symptom-form-error"></div>
        <button type="button" class="btn btn-primary btn-small" onclick="addSymptomLog()">Log symptom</button>
      </div>
    </div>

    <div id="tab-titration" class="tab-panel hidden">
      <div id="titration-list" class="history-list"></div>
      <div class="inline-add-form">
        <div class="field-row">
          <label class="field">
            Date
            <input type="date" id="dose-change-date">
          </label>
          <label class="field">
            New dosage
            <input type="text" id="dose-change-new-dosage" placeholder="e.g. 20mg">
          </label>
        </div>
        <label class="field field-wide">
          Notes <span class="optional">(optional)</span>
          <textarea id="dose-change-notes" rows="2" placeholder="Reason for the change, how you're tolerating it..."></textarea>
        </label>
        <div class="form-error" id="dose-change-form-error"></div>
        <button type="button" class="btn btn-primary btn-small" onclick="addDoseChange()">Log dose change</button>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" id="history-close-btn" class="btn btn-ghost">Close</button>
    </div>
  </div>
</div>

<script src="app.js?v=11"></script>
</body>
</html>
